version: '3.8'

services:
  backend-ai:
    build: ./ai
    container_name: rag_backend
    restart: unless-stopped
    env_file: ./ai/.env
    environment:
      SQLITE_PATH: /data/chat_history.db
    ports:
      - "8000:8000"
    volumes:
      - chat_data:/data
      - chroma_data:/app/db_loker
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend-view:
    build: ./view
    container_name: rag_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend-ai:
        condition: service_healthy

volumes:
  chat_data:
  chroma_data: