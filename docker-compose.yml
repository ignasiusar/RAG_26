services:
  backend-ai:
    build: ./ai
    container_name: rag_backend
    restart: unless-stopped
    env_file: ./ai/.env
    environment:
      SQLITE_PATH: /data/chat_history.db
    ports:
      - "8000:8000"
    volumes:
      - chat_data:/data
      - chroma_data:/app/db_loker
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend-view:
    build: ./view
    container_name: rag_frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://backend-ai:8000
    ports:
      - "5173:5173"
    depends_on:
      backend-ai:
        condition: service_healthy
       
  datasette:
      image: datasetteproject/datasette
      container_name: datasette
      restart: unless-stopped
      ports:
        - "127.0.0.1:8001:8001"
      volumes:
        - chat_data:/data
      command: datasette /data/chat_history.db -h 0.0.0.0 -p 8001
      depends_on:
        - backend-ai
  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - chat_data:/data
      - ./adminer/login-password-less.php:/var/www/html/plugins-enabled/login-password-less.php
    depends_on:
      - backend-ai

volumes:
  chat_data:
  chroma_data: